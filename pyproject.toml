[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker"
version = "0.1.0"
description = "A simple expense tracking CLI"
authors = [{ name="Terrance Ho" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "tabulate>=0.9.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[project.scripts]
expense-tracker = "expense_tracker.main:main"